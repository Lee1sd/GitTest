<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="틈새 - 지도 | 서울의 모든 틈새 장소를 한눈에 확인하세요">
    <title>지도 | 틈새</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/theme.css">

    <style>
        /* Map Page Specific Styles */
        body {
            overflow: hidden;
            /* Prevent scrolling for full-screen map */
        }

        .map-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background-color: var(--bg-color);
        }

        .map-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Adjust header for map page visibility */
        .header {
            background: rgba(44, 44, 44, 0.95);
            border-bottom: 1px solid var(--border-color);
        }

        /* Embed Mode Styles */
        body.is-embedded .header {
            display: none !important;
        }
    </style>
    <!-- Header (Dynamic) -->
    <div id="header-placeholder"></div>

    <main>
        <div class="map-container">
            <iframe class="map-iframe"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d101903.72871963792!2d126.92297529726561!3d37.52664539999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357ca28b61c565cd%3A0x858aedb4e4ea83eb!2sSeoul!5e0!3m2!1sen!2skr!4v1708000000000!5m2!1sen!2skr"
                allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/auth-guard.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/components.js"></script>
    </body>

</html>
