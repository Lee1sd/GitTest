<div class="place-modal-backdrop" id="place-modal-backdrop">
    <div class="place-modal" id="place-modal">
        <button class="place-modal__close" id="place-modal-close" aria-label="닫기">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <div class="place-modal__hero">
            <img src="" alt="" class="place-modal__image" id="modal-hero-image">
            <div class="place-modal__overlay"></div>
            <div class="place-modal__header">
                <div class="place-modal__top-badges">
                    <span class="place-modal__congestion" id="modal-congestion">
                        <!-- JS injects content/classes -->
                        <span id="modal-congestion-text">혼잡도</span>
                    </span>
                </div>
                <h2 class="place-modal__title" id="modal-title">장소 이름</h2>
                <div class="place-modal__meta">
                    <span class="place-modal__category" id="modal-category">카테고리</span>
                    <span class="place-modal__address" id="modal-address">주소</span>
                </div>
            </div>
        </div>

        <div class="place-modal__content">
            <div class="place-modal__section">
                <h3 class="place-modal__section-title">소개</h3>
                <p class="place-modal__desc" id="modal-description">설명</p>
            </div>

            <div class="place-modal__section">
                <h3 class="place-modal__section-title">특징</h3>
                <div class="place-modal__tags" id="modal-tags">
                    <!-- Tags populated by JS -->
                </div>
            </div>

            <div class="place-modal__section" id="modal-features-section">
                <h3 class="place-modal__section-title">주요 특징</h3>
                <div class="place-modal__features" id="modal-features">
                    <!-- Features populated by JS -->
                </div>
            </div>

            <div class="place-modal__section">
                <h3 class="place-modal__section-title">방문 정보</h3>
                <div class="place-modal__info-grid">
                    <div class="place-modal__info-item">
                        <span class="icon">🕐</span>
                        <div>
                            <span class="label">운영 시간</span>
                            <span class="value" id="modal-hours">-</span>
                        </div>
                    </div>
                    <div class="place-modal__info-item">
                        <span class="icon">💰</span>
                        <div>
                            <span class="label">입장료 (이용료)</span>
                            <span class="value" id="modal-admission">-</span>
                        </div>
                    </div>
                    <div class="place-modal__info-item">
                        <span class="icon">📅</span>
                        <div>
                            <span class="label">추천 시간</span>
                            <span class="value" id="modal-recommend-time">-</span>
                        </div>
                    </div>
                    <div class="place-modal__info-item">
                        <span class="icon">👥</span>
                        <div>
                            <span class="label">수용 가능 인원</span>
                            <span class="value" id="modal-capacity">-</span>
                        </div>
                    </div>
                    <div class="place-modal__info-item">
                        <span class="icon">🔗</span>
                        <div>
                            <span class="label">웹사이트</span>
                            <a href="#" target="_blank" class="value link" id="modal-homepage">바로가기</a>
                        </div>
                    </div>
                    <div class="place-modal__info-item">
                        <span class="icon">⭐</span>
                        <div>
                            <span class="label">평점</span>
                            <span class="value" id="modal-rating">-</span>
                        </div>
                    </div>
                    <div class="place-modal__info-item full-width">
                        <span class="icon">📢</span>
                        <div>
                            <span class="label">현장 상황 (서울시 데이터)</span>
                            <span class="value" id="modal-congestion-msg">-</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="place-modal__section">
                <h3 class="place-modal__section-title">주변 맛집</h3>
                <div class="place-modal__restaurants" id="modal-restaurants">
                    <!-- Restaurants populated by JS -->
                </div>
            </div>

            <div class="place-modal__section" id="modal-gallery-section">
                <h3 class="place-modal__section-title">갤러리</h3>
                <div class="place-modal__gallery" id="modal-gallery">
                    <!-- Images populated by JS -->
                </div>
            </div>

            <div class="place-modal__section" id="modal-reviews-section">
                <h3 class="place-modal__section-title">리뷰 <span id="review-count" class="review-count">(0)</span>
                </h3>

                <!-- Review Stats -->
                <div class="review-stats">
                    <div class="review-stats__score">
                        <span class="score-value" id="review-avg-rating">0.0</span>
                        <div class="score-stars" id="review-avg-stars">☆☆☆☆☆</div>
                    </div>
                    <button class="btn btn-primary btn-sm" id="btn-write-review">리뷰 작성하기</button>
                </div>

                <!-- Review Form (Hidden by default) -->
                <div class="review-form" id="review-form" style="display: none;">
                    <h4 class="review-form__title">리뷰 작성</h4>

                    <div class="review-form__title-input">
                        <label>제목</label>
                        <input type="text" id="review-title" placeholder="리뷰 제목을 입력해주세요" maxlength="50">
                    </div>

                    <div class="review-form__rating">
                        <label>별점</label>
                        <div class="star-rating" id="review-star-input">
                            <input type="radio" name="rating" value="5" id="star5"><label for="star5">★</label>
                            <input type="radio" name="rating" value="4" id="star4"><label for="star4">★</label>
                            <input type="radio" name="rating" value="3" id="star3"><label for="star3">★</label>
                            <input type="radio" name="rating" value="2" id="star2"><label for="star2">★</label>
                            <input type="radio" name="rating" value="1" id="star1"><label for="star1">★</label>
                        </div>
                    </div>

                    <div class="review-form__content">
                        <textarea id="review-text" placeholder="방문 후기를 자세히 남겨주세요. (최소 10자)" rows="4"></textarea>
                    </div>

                    <div class="review-form__media">
                        <label class="media-upload-btn">
                            <span class="icon">📷</span> 사진/영상 추가
                            <input type="file" id="review-media-input" accept="image/*,video/*" multiple hidden>
                        </label>
                        <div class="media-preview" id="media-preview"></div>
                    </div>

                    <div class="review-form__actions">
                        <button class="btn btn-secondary btn-sm" id="btn-cancel-review">취소</button>
                        <button class="btn btn-primary btn-sm" id="btn-submit-review">등록 완료</button>
                    </div>
                </div>

                <!-- Review List -->
                <div class="review-list" id="review-list">
                    <!-- Reviews populated by JS -->
                    <div class="review-empty">
                        <p>아직 작성된 리뷰가 없습니다.</p>
                        <p>첫 번째 리뷰를 남겨보세요!</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Planner Sidebar (Right) -->
        <div class="place-modal__footer" id="modal-planner-sidebar">
            <div class="planner-sidebar__header">
                <h4>내 여행 일정</h4>
                <span class="planner-date" id="mini-plan-date">날짜 없음</span>
            </div>

            <div class="planner-sidebar__list" id="mini-plan-list">
                <!-- Items populated by JS -->
                <div class="planner-empty">
                    <p>일정이 비어있습니다.</p>
                    <a href="planner.html" class="link">여행 계획하러 가기 &rarr;</a>
                </div>
            </div>

            <div class="planner-sidebar__actions" id="planner-action-area">
                <p class="planner-status" id="planner-status-msg"></p>
                <button class="btn btn-accent btn-full" id="btn-add-to-plan">
                    <span class="icon">➕</span> <span class="btn-text">일정에 담기</span>
                </button>
            </div>
        </div>
    </div>
</div>
