<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="틈새 - 장소 탐색">
    <title>장소 탐색 | 틈새</title>

    <!-- 파비콘 -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">

    <!-- 스타일시트 -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/reviews.css">
    <link rel="stylesheet" href="css/lightbox.css">

    <style>
        /* Explore 페이지 전용 스타일 */
        .explore-container {
            padding-top: var(--header-height);
            min-height: 100vh;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 12px 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .search-box:focus-within {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--text-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .search-box__icon {
            color: rgba(255, 255, 255, 0.7);
            margin-right: 15px;
        }

        .search-box__input {
            background: none;
            border: none;
            outline: none;
            width: 100%;
            font-size: 1.1rem;
            color: var(--text-color);
            font-family: var(--font-serif);
        }

        .search-box__input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .main__filters {
            margin-bottom: 30px;
        }

        .filter-section {
            margin-bottom: 15px;
        }

        .filter-section__label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 8px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.6);
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: rgba(255, 255, 255, 0.4);
            color: var(--text-color);
        }

        .filter-btn.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(212, 175, 55, 0.1);
        }

        /* 분할 뷰 / 지도 토글 로직 */
        .split-view-container {
            display: flex;
            gap: 20px;
            position: relative;
        }

        .list-panel {
            width: 100%;
            transition: width 0.3s ease;
        }

        .list-panel.shrunk {
            width: 50%;
        }

        .map-panel {
            display: none;
            width: 50%;
            position: sticky;
            top: 100px;
            height: calc(100vh - 120px);
            background: #222;
            border-radius: 8px;
            overflow: hidden;
        }

        .map-panel.active {
            display: block;
        }

        /* 장소 그리드 */
        .places-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            padding-bottom: 60px;
        }

        /* 장소 카드 스타일 */
        .place-card {
            background: #333;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .place-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .place-card__image {
            height: 200px;
            background: #444;
            overflow: hidden;
            position: relative;
        }

        .place-card__image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .place-card:hover .place-card__image img {
            transform: scale(1.05);
        }

        .place-card__save {
            position: absolute;
            top: 15px;
            left: 15px;
            /* Moved to Left */
            right: auto;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            z-index: 10;
        }

        .place-card__save:hover {
            background: rgba(212, 175, 55, 0.8);
            transform: scale(1.1);
        }

        .place-card__save.saved {
            color: var(--accent-color);
            background: rgba(0, 0, 0, 0.7);
        }

        .place-card__content {
            padding: 20px;
        }

        .place-card__title {
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: var(--text-color);
            font-family: var(--font-serif);
        }

        .place-card__desc {
            font-size: 0.9rem;
            color: rgba(244, 244, 240, 0.6);
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .place-card__tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Badge Base Style Update */
        .place-card__badge {
            position: absolute;
            top: 15px;
            left: auto;
            right: 15px;
            /* Moved to Right */
            padding: 4px 10px;
            /* Reduced Size */
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #FFFFFF;
            z-index: 2;
            text-transform: uppercase;
            width: fit-content;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
        }

        .place-card__badge--normal {
            background: linear-gradient(135deg, #FFB300, #F57F17);
            /* Vivid Amber Gradient */
        }

        .place-card__badge--crowded {
            background: linear-gradient(135deg, #E53935, #C62828);
            /* Deep Red Gradient */
        }

        .place-card__badge--quiet {
            background: linear-gradient(135deg, #26A69A, #00897B);
            /* Calm Teal Gradient */
        }

        .place-card__category {
            display: block;
            font-size: 0.8rem;
            color: var(--accent-color);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <!-- 헤더 (Dynamic) -->
    <div id="header-placeholder"></div>

    <main class="explore-container">
        <div class="container">
            <div class="split-view-container">
                <!-- 리스트 패널 -->
                <div class="list-panel" id="content-panel">

                    <!-- 검색 박스 -->
                    <div id="places-search-container"
                        style="font-size: 0.75rem; color: var(--accent-color); margin-bottom: 0.5rem; letter-spacing: 2px; font-weight: 600;">
                        SEARCH PLACES</div>
                    <div class="search-box">
                        <svg class="search-box__icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" class="search-box__input" placeholder="장소, 분위기, 지역을 검색해보세요 (예: 경복궁, 야경)">
                    </div>

                    <!-- 필터 --->
                    <div class="main__filters">
                        <div class="filter-section">
                            <h3 class="filter-section__label">카테고리</h3>
                            <div class="filter-buttons" id="category-filters">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <div class="filter-section">
                            <h3 class="filter-section__label">테마</h3>
                            <div class="filter-buttons" id="mood-filters">
                                <!-- Populated by JS -->
                            </div>
                        </div>
                    </div>

                    <!-- 장소 그리드 -->
                    <div class="places-grid" id="places-grid">
                        <!-- Populated by JS -->
                    </div>

                </div>

                <!-- 지도 패널 -->
                <div class="map-panel" id="map-panel">
                    <div id="map-view" style="width: 100%; height: 100%; background: #2C2C2C;">
                        <iframe id="map-iframe"
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d101903.72871963792!2d126.92297529726561!3d37.52664539999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357ca28b61c565cd%3A0x858aedb4e4ea83eb!2sSeoul!5e0!3m2!1sen!2skr!4v1708000000000!5m2!1sen!2skr"
                            style="width: 100%; height: 100%; border: 0;" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 푸터 (Dynamic) -->
    <div id="footer-placeholder"></div>

    <!-- 모달 컨테이너 -->
    <div id="modal-container"></div>

    <!-- 지도 오버레이 (헤더 '지도' 버튼 클릭 시 표시) -->
    <div id="map-overlay" class="map-overlay">
        <iframe src="" frameborder="0" loading="lazy"></iframe>
    </div>

    <!-- Firebase (v12 CDN - compat) -->
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-storage-compat.js"></script>

    <script src="js/firebase-config.js?v=3"></script>
    <script src="js/reviews.js?v=1"></script>
    <script src="js/modal-planner.js?v=1"></script>
    <script src="js/app.js?v=3"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/components.js"></script>
    <script src="js/map-toggle.js"></script>
    <script src="js/lightbox.js"></script>

    <script>
        // 로그인 상태 확인 & 헤더 처리
        document.addEventListener('DOMContentLoaded', function () {
            if (window.AuthGuard) {
                AuthGuard.updateHeaderUI();
            }

            // Scroll header effect - 동적 로드된 헤더에도 적용 가능하도록 이벤트 리스너 추가
            window.addEventListener('scroll', () => {
                const header = document.querySelector('.header');
                if (header) {
                    if (window.scrollY > 50) header.classList.add('scrolled');
                    else header.classList.remove('scrolled');
                }
            });
        });
    </script>
</body>

</html>
