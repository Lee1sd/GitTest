<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="틈새 - 비밀번호 재설정">
    <title>비밀번호 재설정 | 틈새</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages.css">

    <!-- Firebase SDK (CDN)  -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Firebase Config & Auth Guard -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth-guard.js"></script>

    <style>
        /* ===== 로그인 페이지 스타일 재사용 (다크 글래스 테마) ===== */
        body {
            background-color: #1A1A1A;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1A1A1A 0%, #2C2C2C 100%);
            position: relative;
            overflow: hidden;
        }

        /* 배경 조명 효과 */
        .intro__bg-dark {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(20, 20, 20, 0) 0%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 0;
        }

        /* 뒤로가기 버튼 스타일 */
        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            padding: 10px 20px;
            background: rgba(44, 44, 44, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 30px;
            color: rgba(244, 244, 240, 0.8);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .back-link:hover {
            background: rgba(44, 44, 44, 0.8);
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* ===== 다크 글래스 카드 컨테이너 ===== */
        .login-container {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: rgba(30, 30, 30, 0.65);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            animation: fadeInUp 0.8s ease forwards;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: bold;
            background: linear-gradient(135deg, #D4AF37 0%, #F5E6A3 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        .login-subtitle {
            font-family: var(--font-serif);
            font-size: 0.95rem;
            color: rgba(244, 244, 240, 0.6);
            line-height: 1.5;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            margin-left: 4px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        .login-submit {
            margin-top: 10px;
            padding: 14px;
            background: linear-gradient(135deg, #D4AF37 0%, #B8960B 100%);
            color: #1A1A1A;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .login-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            filter: brightness(1.1);
        }

        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 7px;
            font-size: 0.9rem;
            display: none;
            margin-bottom: 7px;
            text-align: center;
        }

        .success-message {
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid rgba(40, 167, 69, 0.3);
            color: #4cd137;
            padding: 10px;
            border-radius: 7px;
            font-size: 0.9rem;
            display: none;
            margin-bottom: 7px;
            text-align: center;
        }

        .error-message.show,
        .success-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>

<body>
    <!-- Back Button -->
    <a href="login.html" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        <span>로그인으로 돌아가기</span>
    </a>

    <main class="login-page">
        <!-- Dark BG Overlay -->
        <div class="intro__bg-dark"></div>

        <!-- Warm Glow Effects -->
        <div class="warm-glow warm-glow--1"></div>
        <div class="warm-glow warm-glow--2"></div>
        <div class="warm-glow warm-glow--3"></div>

        <!-- Lanterns (Exact copy from index.html) -->
        <div class="lantern lantern--1">
            <svg viewBox="0 0 80 100" width="70" height="90">
                <ellipse cx="40" cy="12" rx="18" ry="6" fill="#2C1810" stroke="#1A0F0A" stroke-width="1" />
                <path d="M22 12 Q14 50 22 85 L58 85 Q66 50 58 12 Z" fill="url(#floatLantern1)" stroke="#3D2817"
                    stroke-width="1.5" />
                <ellipse cx="40" cy="87" rx="18" ry="5" fill="#2C1810" stroke="#1A0F0A" stroke-width="1" />
                <path d="M28 25 Q40 30 52 25" stroke="rgba(255,200,100,0.3)" stroke-width="1" fill="none" />
                <path d="M26 50 Q40 55 54 50" stroke="rgba(255,200,100,0.2)" stroke-width="1" fill="none" />
                <path d="M28 75 Q40 80 52 75" stroke="rgba(255,200,100,0.3)" stroke-width="1" fill="none" />
                <defs>
                    <radialGradient id="floatLantern1" cx="50%" cy="30%" r="80%">
                        <stop offset="0%" stop-color="#FFEDD5" />
                        <stop offset="40%" stop-color="#FF9F45" />
                        <stop offset="80%" stop-color="#E85D04" />
                        <stop offset="100%" stop-color="#9D4A1A" />
                    </radialGradient>
                </defs>
            </svg>
            <div class="lantern-light"></div>
        </div>

        <div class="lantern lantern--2">
            <svg viewBox="0 0 60 80" width="50" height="70">
                <ellipse cx="30" cy="10" rx="14" ry="5" fill="#2C1810" stroke="#1A0F0A" stroke-width="1" />
                <path d="M16 10 Q10 40 16 68 L44 68 Q50 40 44 10 Z" fill="url(#floatLantern2)" stroke="#3D2817"
                    stroke-width="1.5" />
                <ellipse cx="30" cy="70" rx="14" ry="4" fill="#2C1810" stroke="#1A0F0A" stroke-width="1" />
                <path d="M20 22 Q30 26 40 22" stroke="rgba(255,200,100,0.3)" stroke-width="1" fill="none" />
                <path d="M18 42 Q30 46 42 42" stroke="rgba(255,200,100,0.2)" stroke-width="1" fill="none" />
                <defs>
                    <radialGradient id="floatLantern2" cx="50%" cy="30%" r="80%">
                        <stop offset="0%" stop-color="#FFF3E0" />
                        <stop offset="40%" stop-color="#FFB74D" />
                        <stop offset="80%" stop-color="#F57C00" />
                        <stop offset="100%" stop-color="#8B4513" />
                    </radialGradient>
                </defs>
            </svg>
            <div class="lantern-light"></div>
        </div>

        <!-- Reset Password Card -->
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">비밀번호 재설정</div>
                <p class="login-subtitle">가입한 이메일 주소를 입력하시면<br>비밀번호 재설정 링크를 보내드립니다.</p>
            </div>

            <form class="login-form" id="reset-form">
                <div class="error-message" id="error-message"></div>
                <div class="success-message" id="success-message"></div>

                <div class="form-group">
                    <label class="form-label" for="email">이메일</label>
                    <input type="email" id="email" class="form-input" placeholder="example@email.com" required>
                </div>

                <button type="submit" class="login-submit">재설정 메일 보내기</button>
            </form>
        </div>
    </main>
    <script>
        document.getElementById('reset-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            const submitBtn = this.querySelector('button[type="submit"]');

            if (!email) {
                errorMessage.textContent = '이메일을 입력해주세요.';
                errorMessage.classList.add('show');
                successMessage.classList.remove('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '전송 중...';
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            try {
                await window.auth.sendPasswordResetEmail(email);

                successMessage.textContent = '비밀번호 재설정 메일을 보냈습니다. 이메일을 확인해주세요.';
                successMessage.classList.add('show');

                // 2초 후 로그인 페이지로 이동
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error('Password reset error:', error);

                let errorText = '메일 전송에 실패했습니다.';
                if (error.code === 'auth/user-not-found') {
                    errorText = '등록되지 않은 이메일입니다.';
                } else if (error.code === 'auth/invalid-email') {
                    errorText = '유효하지 않은 이메일 형식입니다.';
                }

                errorMessage.textContent = errorText;
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = '재설정 메일 보내기';
            }
        });
    </script>
</body>

</html>
