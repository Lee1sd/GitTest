<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="틈새 - 나만의 여행 일정 만들기">
    <title>여행 계획 | 틈새</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/theme.css">

    <style>
        /* Planner Specific Styles */
        .planner {
            padding-top: 90px;
            min-height: 100vh;
            background-color: transparent;
            /* Fix white background issue */
        }

        .planner__header {
            text-align: center;
            padding: 20px 0 40px;
        }

        .planner__title {
            color: var(--text-color);
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .planner__subtitle {
            color: rgba(244, 244, 240, 0.7);
            font-size: 1.1rem;
        }

        /* Sidebar & Timeline Containers */
        .planner__sidebar,
        .planner__timeline {
            background: #333;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .planner__sidebar-title {
            color: var(--text-color);
            font-family: var(--font-serif);
        }

        /* Items in lists */
        .planner__saved-item,
        .planner__timeline-item {
            background: rgba(255, 255, 255, 0.05);
            /* Matched to recommend.html */
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 15px;
            transition: all 0.2s;
        }

        .planner__saved-item:hover,
        .planner__timeline-item:hover {
            background: #505050;
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .planner__item-title {
            font-weight: bold;
            color: var(--text-color);
        }

        .planner__item-category {
            color: var(--accent-color);
            font-size: 0.85rem;
        }

        /* Fixed Visibility for Saved Items */
        .planner__saved-name {
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 2px;
        }

        .planner__saved-category {
            color: var(--accent-color);
            font-size: 0.85rem;
        }

        /* Fixed Visibility for Timeline Items */
        .planner__timeline-info h4 {
            color: var(--text-color);
            margin-bottom: 4px;
            font-size: 1.1rem;
            margin-top: 0;
        }

        .planner__timeline-info p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            line-height: 1.4;
            margin: 0;
        }

        /* Empty States */
        #empty-saved,
        .planner__empty {
            color: rgba(255, 255, 255, 0.4) !important;
        }

        /* Date Picker */
        .planner__date-input {
            background: #444;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 4px;
        }

        /* planner 페이지에서는 라이트박스 기본 숨김 */
  .lightbox-overlay {
    display: none;
  }

  .lightbox-overlay.active {
    display: flex;
  }
    </style>
</head>

<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Planner Page -->
    <main class="planner">
        <div class="p-container">
            <!-- Header -->
            <div class="planner__header reveal">
                <h1 class="planner__title">나만의 여행 일정</h1>
                <p class="planner__subtitle">저장한 장소들로 특별한 하루를 계획해보세요</p>
            </div>

            <!-- Content -->
            <div class="planner__content">
                <!-- Sidebar - Saved Places -->
                <aside class="planner__sidebar reveal-left">
                    <h2 class="planner__sidebar-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                            </path>
                        </svg>
                        저장된 장소
                    </h2>
                    <p style="font-size: 0.875rem; color: var(--color-gray); margin-bottom: 1rem;">
                        장소를 타임라인에 드래그하세요
                    </p>
                    <div class="planner__saved-list" id="saved-list">
                        <!-- Saved places will be rendered here -->
                    </div>
                    <div id="empty-saved"
                        style="display: none; text-align: center; padding: 2rem; color: var(--color-gray);">
                        <p style="font-size: 2rem; margin-bottom: 0.5rem;">📍</p>
                        <p>저장된 장소가 없습니다</p>
                        <a href="index.html" class="btn btn-primary btn-sm" style="margin-top: 1rem;">장소 둘러보기</a>
                    </div>
                </aside>

                <!-- Timeline -->
                <div class="planner__timeline reveal-right">
                    <div class="planner__timeline-header">
                        <h2 class="planner__sidebar-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                <line x1="16" y1="2" x2="16" y2="6" />
                                <line x1="8" y1="2" x2="8" y2="6" />
                                <line x1="3" y1="10" x2="21" y2="10" />
                            </svg>
                            여행 일정
                        </h2>
                        <div class="planner__date-picker">
                            <label for="travel-date" style="font-size: 0.875rem; color: var(--color-gray);">날짜:</label>
                            <input type="date" id="travel-date" class="planner__date-input">
                            <span>~</span>
                            <input type="date" id="end-date" class="planner__date-input">
                        </div>
                        <button class="planner__myplans-btn" id="open-myplans" title="저장된 일정 보기">
                            <img width="27" height="27"
                                src="https://img.icons8.com/ios-filled/50/FAB005/calendar--v1.png" alt="calendar--v1" />
                        </button>
                    </div>

                    <div class="planner__timeline-items" id="timeline-items">
                        <!-- Timeline items will be rendered here -->
                    </div>

                    <div class="planner__empty" id="timeline-empty">
                        <div class="planner__empty-icon">📅</div>
                        <p>아직 일정이 없습니다</p>
                        <p style="font-size: 0.875rem; margin-top: 0.5rem;">왼쪽에서 장소를 드래그하거나 클릭하여 추가하세요</p>
                    </div>

                    <!-- Actions -->
                    <div style="display: flex; gap: 1rem; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--color-secondary);"
                        id="timeline-actions">
                        <button class="btn btn-primary" id="save-plan">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                                <polyline points="17 21 17 13 7 13 7 21" />
                                <polyline points="7 3 7 8 15 8" />
                            </svg>
                            일정 저장
                        </button>
                        <button class="btn btn-secondary" id="share-plan">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="18" cy="5" r="3" />
                                <circle cx="6" cy="12" r="3" />
                                <circle cx="18" cy="19" r="3" />
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                            </svg>
                            공유하기
                        </button>
                        <button class="btn btn-glass" id="clear-plan" style="margin-left: auto;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polyline points="3 6 5 6 21 6" />
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                            </svg>
                            초기화
                        </button>
                    </div>
                </div>

                 <!--todolist-->
                <aside class="planner_Todo">
                    <div class="todo-add">
                        <h5>todolist</h5>
                        <button class="todo-add-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                    </div>

                    <!--체크 박스 쌓일 영역-->
                    <div class="todo-list">
                    </div>
                </aside>

                <!-- 내 일정 슬라이드 패널 -->
                <aside id="myplans-panel" class="myplans-panel">
                    <div class="myplans-header">
                        <h3>내 일정</h3>
                        <button id="close-myplans" aria-label="닫기">✕</button>
                    </div>

                    <button class="myplans-new-btn">＋ 새로 일정 만들기</button>

                    <div class="myplans-list">
                        <!-- JS가 여기다 일정 카드들을 렌더링함 -->

                    </div>
                </aside>


            </div>
        </div>

        <div id="plan-name-modal" class="plan-name-modal">
            <div class="plan-name-box">
                <span>일정 이름 설정</span>
                <input type="text" id="plan-name-input" placeholder="예: 사유 3박 4일" />
                <div class="plan-name-actions">
                    <button id="cancel-plan-name" class="btn btn-glass">취소</button>
                    <button id="confirm-plan-name" class="btn btn-primary">저장</button>
                </div>
            </div>
        </div>


            </div>
        </div>
    </main>


      <!-- 푸터 (Dynamic) -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <!-- Firebase (v12 CDN - compat) -->
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-auth-compat.js"></script> 
<script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-storage-compat.js"></script>

    <script src="js/firebase-config.js?v=4"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/planner.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/components.js"></script>
    <script src="js/map-toggle.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/p-ui.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Check login state and update UI
        document.addEventListener('DOMContentLoaded', () => {
            if (window.AuthGuard) {
                // Page-level protection for planner.html
                AuthGuard.checkPageAuth();
                AuthGuard.updateHeaderUI();
            }

            // Add scroll listener for header
            const header = document.querySelector('.header');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });
        });
    </script>
    <script src="js/logout.js"></script>
    <script src="js/map-toggle.js"></script>

    <!-- 지도 오버레이 -->
    <div id="map-overlay" class="map-overlay">
        <iframe src="" frameborder="0" loading="lazy"></iframe>
    </div>
</body>

</html>
