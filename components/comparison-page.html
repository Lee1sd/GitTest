<div class="place-modal-backdrop" id="comparison-modal-backdrop">
    <div class="comparison-modal">
        <button class="place-modal__close" id="comparison-modal-close" aria-label="닫기">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <div class="comparison-header">
            <div class="header-content">
                <h2 class="comparison-title">
                    <span class="icon">✨</span> 유사 추천
                </h2>
                <p class="comparison-desc">
                    더 쾌적하거나 평점이 높은<br>
                    대인 장소를 추천합니다.
                </p>
            </div>
        </div>

        <div class="comparison-body">
            <!-- Recommendations List Only -->
            <div class="comp-list" id="comp-recommend-list">
                <!-- Loading State -->
                <div class="comp-loading">
                    <div class="spinner"></div>
                    <p>분석 중...</p>
                </div>
            </div>
        </div>

        <div class="comparison-footer">
            <button class="btn btn-primary" id="comparison-close-bottom">확인</button>
        </div>
    </div>
</div>
