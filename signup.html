    <style>
        /* ===== 회원가입 페이지 - 다크 글래스 테마 ===== */
        body {
            background-color: #1A1A1A;
            margin: 0;
            padding: 0;
            overflow-y: auto;
        }

        .signup-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1A1A1A 0%, #2C2C2C 100%);
            position: relative;
            overflow: hidden;
            padding: 40px 20px;
        }

        /* 배경 조명 효과 */
        .intro__bg-dark {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(20, 20, 20, 0) 0%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 0;
        }

        /* 뒤로가기 버튼 스타일 */
        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            padding: 10px 20px;
            background: rgba(44, 44, 44, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 30px;
            color: rgba(244, 244, 240, 0.8);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .back-link:hover {
            background: rgba(44, 44, 44, 0.8);
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* ===== 다크 글래스 카드 컨테이너 ===== */
        .signup-container {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: rgba(30, 30, 30, 0.65);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            animation: fadeInUp 0.8s ease forwards;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .signup-logo {
            font-size: 3rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-weight: bold;
        }

        .signup-logo-text {
            background: linear-gradient(135deg, #D4AF37 0%, #F5E6A3 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .signup-logo-gap {
            display: inline-block;
            width: 8px;
            height: 36px;
            background: linear-gradient(180deg, transparent 0%, rgba(212, 175, 55, 0.5) 50%, transparent 100%);
            border-radius: 2px;
        }

        .signup-subtitle {
            font-family: var(--font-serif);
            font-size: 0.95rem;
            color: rgba(244, 244, 240, 0.6);
            letter-spacing: 1px;
        }

        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            margin-left: 4px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .password-requirements {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            border-left: 2px solid rgba(212, 175, 55, 0.3);
        }

        .password-requirements ul {
            margin: 0;
            padding-left: 20px;
            list-style: none;
        }

        .password-requirements li {
            margin: 2px 0;
        }

        .password-requirements li.valid {
            color: rgba(76, 175, 80, 0.8);
        }

        .signup-submit {
            margin-top: 10px;
            padding: 14px;
            background: linear-gradient(135deg, #D4AF37 0%, #B8960B 100%);
            color: #1A1A1A;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .signup-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            filter: brightness(1.1);
        }

        .signup-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        .social-signup {
            display: flex;
            gap: 15px;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .signup-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .signup-footer a {
            color: var(--accent-color);
            font-weight: 600;
            text-decoration: none;
        }

        .signup-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            margin-bottom: 10px;
        }

        .error-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .success-message {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4caf50;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            margin-bottom: 10px;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .signup-container {
                max-width: 100%;
                padding: 30px 20px;
            }

            .signup-page {
                padding: 20px;
            }
        }
    </style>
</head>

    <!-- 회원가입 스크립트 -->
    <script>
        // DOM 요소
        const signupForm = document.getElementById('signup-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const passwordConfirmInput = document.getElementById('passwordConfirm');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const signupBtn = signupForm.querySelector('button[type="submit"]');

        // 페이지 로드 시 로그인 상태 확인
        window.addEventListener('load', () => {
            if (AuthGuard.isLoggedIn()) {
                window.location.href = 'index.html';
            }
        });

        // 비밀번호 요구사항 검증
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            
            const hasLength = password.length >= 8;
            const hasLowercase = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);

            updateRequirement('req-length', hasLength);
            updateRequirement('req-lowercase', hasLowercase);
            updateRequirement('req-number', hasNumber);
        });

        function updateRequirement(id, isValid) {
            const element = document.getElementById(id);
            if (isValid) {
                element.classList.add('valid');
            } else {
                element.classList.remove('valid');
            }
        }

        // 이메일 회원가입
        signupForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const passwordConfirm = passwordConfirmInput.value;

            // 유효성 검사
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            if (!email) {
                showError('이메일을 입력해주세요.');
                return;
            }

            if (password.length < 8) {
                showError('비밀번호는 8자 이상이어야 합니다.');
                return;
            }

            if (!/[a-z]/.test(password) || !/[0-9]/.test(password)) {
                showError('비밀번호는 소문자와 숫자를 포함해야 합니다.');
                return;
            }

            if (password !== passwordConfirm) {
                showError('비밀번호가 일치하지 않습니다.');
                return;
            }

            signupBtn.disabled = true;
            const originalText = signupBtn.textContent;
            signupBtn.textContent = '가입 중...';

            try {
                // Firebase 가입
                const result = await window.auth.createUserWithEmailAndPassword(email, password);
                const user = result.user;

                // 프로필 업데이트
                await user.updateProfile({
                    displayName: email.split('@')[0]
                });

                // Firestore에 사용자 정보 저장
                await window.db.collection('users').doc(user.uid).set({
                    email: user.email,
                    displayName: email.split('@')[0],
                    photoURL: null,
                    provider: 'email',
                    createdAt: new Date()
                });

                // 로그인 상태 저장
                const userData = {
                    uid: user.uid,
                    email: user.email,
                    displayName: email.split('@')[0],
                    name: email.split('@')[0],
                    photoURL: null,
                    provider: 'email',
                    isLoggedIn: true
                };
                localStorage.setItem('teumsae_user', JSON.stringify(userData));
                AuthGuard.updateHeaderUI();

                showSuccess('회원가입이 완료되었습니다!');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('Signup error:', error);
                let errorText = '회원가입에 실패했습니다.';

                if (error.code === 'auth/email-already-in-use') {
                    errorText = '이미 사용 중인 이메일입니다.';
                } else if (error.code === 'auth/invalid-email') {
                    errorText = '유효하지 않은 이메일 형식입니다.';
                } else if (error.code === 'auth/weak-password') {
                    errorText = '비밀번호가 너무 약합니다.';
                } else if (error.message) {
                    errorText = error.message;
                }

                showError(errorText);
            } finally {
                signupBtn.disabled = false;
                signupBtn.textContent = originalText;
            }
        });

        // 구글 가입
        socialBtn.addEventListener('click', async function(e) {
            e.preventDefault();

            const googleProvider = new firebase.auth.GoogleAuthProvider();
            googleProvider.addScope('profile');
            googleProvider.addScope('email');

            socialBtn.disabled = true;
            const originalText = socialBtn.innerHTML;
            socialBtn.textContent = '가입 중...';
            errorMessage.classList.remove('show');

            try {
                const result = await window.auth.signInWithPopup(googleProvider);
                const user = result.user;

                // Firestore에 사용자 정보 저장
                const userRef = window.db.collection('users').doc(user.uid);
                const userSnap = await userRef.get();

                if (!userSnap.exists) {
                    // 신규 사용자
                    await userRef.set({
                        email: user.email,
                        displayName: user.displayName,
                        photoURL: user.photoURL || null,
                        createdAt: new Date(),
                        loginProvider: 'google'
                    });
                }

                // 로그인 상태 저장
                const userData = {
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName,
                    name: user.displayName,
                    photoURL: user.photoURL || null,
                    provider: 'google',
                    isLoggedIn: true
                };
                localStorage.setItem('teumsae_user', JSON.stringify(userData));
                AuthGuard.updateHeaderUI();

                showSuccess('가입이 완료되었습니다!');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('Google signup error:', error);
                let errorText = '구글 가입 실패';

                if (error.code === 'auth/popup-closed-by-user') {
                    errorText = '가입이 취소되었습니다.';
                } else if (error.code === 'auth/popup-blocked') {
                    errorText = '팝업이 차단되었습니다. 팝업 설정을 확인해주세요.';
                } else if (error.message) {
                    errorText = error.message;
                }

                showError(errorText);
                socialBtn.disabled = false;
                socialBtn.innerHTML = originalText;
            }
        });

        // 에러 메시지 표시
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }

        // 성공 메시지 표시
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }
    </script>

</body>

</html>
