<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="틈새 - 지도 | 서울의 모든 틈새 장소를 한눈에 확인하세요">
    <title>지도 | 틈새</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/theme.css">

    <style>
        /* Map Page Specific Styles */
        body {
            overflow: hidden;
            /* Prevent scrolling for full-screen map */
        }

        .map-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background-color: var(--bg-color);
        }

        .map-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Adjust header for map page visibility */
        .header {
            background: rgba(44, 44, 44, 0.95);
            border-bottom: 1px solid var(--border-color);
        }

        /* Embed Mode Styles */
        body.is-embedded .header {
            display: none !important;
        }
    </style>
    <script>
        // Check if loaded in iframe/embed mode
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('embed') === 'true') {
                document.body.classList.add('is-embedded');
            }
        });
    </script>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header__inner">
                <a href="main.html" class="header__logo"><span class="logo-teum">틈</span><span
                        class="logo-gap"></span><span class="logo-sae">새</span></a>
                <nav class="header__nav">
                    <a href="explore.html" class="header__link hover-underline">장소 탐색</a>
                    <a href="map.html" class="header__link hover-underline active">지도</a>
                    <a href="recommend.html" class="header__link hover-underline">AI 추천</a>
                    <a href="planner.html" class="header__link hover-underline">여행 계획</a>
                </nav>
                <div class="user-menu" id="user-menu">
                    <button class="user-btn">
                        <span class="user-avatar" id="user-avatar">G</span>
                        <span id="user-name">게스트</span>
                    </button>
                    <!-- User Dropdown -->
                    <div class="user-dropdown">
                        <div class="user-dropdown-header">
                            <div class="user-greeting">환영합니다!</div>
                            <div class="user-email" id="user-email">guest@teumsae.kr</div>
                        </div>
                        <a href="planner.html" class="user-dropdown-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                <line x1="16" y1="2" x2="16" y2="6" />
                                <line x1="8" y1="2" x2="8" y2="6" />
                                <line x1="3" y1="10" x2="21" y2="10" />
                            </svg>
                            내 여행 계획
                        </a>
                        <a href="#" class="user-dropdown-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path
                                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                            </svg>
                            저장한 장소
                        </a>
                        <a href="recommend.html" class="user-dropdown-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon
                                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                            </svg>
                            AI 추천받기
                        </a>
                        <div class="user-dropdown-divider"></div>
                        <a href="#" class="user-dropdown-item logout" onclick="logout()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                <polyline points="16 17 21 12 16 7" />
                                <line x1="21" y1="12" x2="9" y2="12" />
                            </svg>
                            로그아웃
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="map-container">
            <iframe class="map-iframe"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d101903.72871963792!2d126.92297529726561!3d37.52664539999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357ca28b61c565cd%3A0x858aedb4e4ea83eb!2sSeoul!5e0!3m2!1sen!2skr!4v1708000000000!5m2!1sen!2skr"
                allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/logout.js"></script>
    <script>
        // Check login state
        function checkAuth() {
            const user = localStorage.getItem('teumsae_user') || sessionStorage.getItem('teumsae_user');
            if (!user) {
                return { isGuest: true };
            }
            return JSON.parse(user);
        }

        // Update user info
        function updateUserInfo(user) {
            const avatar = document.getElementById('user-avatar');
            const name = document.getElementById('user-name');
            if (!avatar || !name) return;

            if (user.isGuest) {
                avatar.textContent = 'G';
                name.textContent = 'Guest';
            } else {
                const initial = user.email ? user.email.charAt(0).toUpperCase() : 'U';
                avatar.textContent = initial;
                name.textContent = user.name || user.email.split('@')[0];
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const user = checkAuth();
            if (user) {
                updateUserInfo(user);
            }
        });
    </script>
</body>

</html>
